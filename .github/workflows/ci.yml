name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          SESSION_SECRET: ci-test-session-secret-at-least-32-chars

      - name: Build
        run: npm run build
        env:
          # 构建期不连接真实服务；仅满足模块对变量名的存在性检查
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder-not-a-real-key
          SESSION_SECRET: ci-build-session-secret-at-least-32-chars
          WEBAUTHN_RP_ID: desk.nopaiseh.com
          WEBAUTHN_ORIGIN: https://desk.nopaiseh.com
          SITE_NAME: 玄机阁
